<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="スペイン語の動詞活用・語彙・例文穴埋めを学ぶアプリ" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a19" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Spanish Word Quiz</title>
    <script>
      // 保存しておいたテーマを最初の描画の前に当てる（ちらつき防止）。正式な設定は IndexedDB にある
      try {
        const theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
